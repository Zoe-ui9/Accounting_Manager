<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 记账管家</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-circle">💰</div>
        <h2>记账管家</h2>
        <p>轻松管理你的每一笔收支</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">用户名</label>
          <input type="text" id="username" class="form-input" placeholder="请输入用户名" required autocomplete="username">
          <div class="form-error" id="usernameError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <input type="password" id="password" class="form-input" placeholder="请输入密码" required autocomplete="current-password">
          <div class="form-error" id="passwordError"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">登 录</button>
      </form>
      <div class="auth-link">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
      <div style="margin-top:12px;text-align:center;font-size:12px;color:var(--text-muted);">
        演示账号：demo / 123456
      </div>
    </div>
  </div>

  <script src="js/utils/storage.js"></script>
  <script src="js/utils/toast.js"></script>
  <script src="js/main.js"></script>
  <script>
    App.init(false);
    App.initDefaultData();

    const form = document.getElementById('loginForm');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      let valid = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      document.getElementById('usernameError').textContent = '';
      document.getElementById('passwordError').textContent = '';
      document.getElementById('username').classList.remove('error');
      document.getElementById('password').classList.remove('error');

      if (!username) {
        document.getElementById('usernameError').textContent = '请输入用户名';
        document.getElementById('username').classList.add('error');
        valid = false;
      }

      if (!password) {
        document.getElementById('passwordError').textContent = '请输入密码';
        document.getElementById('password').classList.add('error');
        valid = false;
      }

      if (!valid) return;

      const users = Storage.get('users', []);
      const user = users.find(u => u.username === username && u.password === password);

      if (!user) {
        Toast.error('用户名或密码错误');
        return;
      }

      Storage.set('currentUser', { id: user.id, username: user.username, phone: user.phone, createdAt: user.createdAt });
      Toast.success('登录成功');
      setTimeout(() => { window.location.href = 'index.html'; }, 500);
    });
  </script>
</body>
</html>
