<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 记账管家</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-circle">💰</div>
        <h2>创建账号</h2>
        <p>开始你的记账之旅</p>
      </div>
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">用户名</label>
          <input type="text" id="username" class="form-input" placeholder="4-16位字母数字下划线" required>
          <div class="form-error" id="usernameError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">手机号</label>
          <input type="tel" id="phone" class="form-input" placeholder="请输入手机号" required>
          <div class="form-error" id="phoneError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <input type="password" id="password" class="form-input" placeholder="至少6位密码" required>
          <div class="form-error" id="passwordError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">确认密码</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="请再次输入密码" required>
          <div class="form-error" id="confirmPasswordError"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">注 册</button>
      </form>
      <div class="auth-link">
        已有账号？<a href="login.html">立即登录</a>
      </div>
    </div>
  </div>

  <script src="js/utils/storage.js"></script>
  <script src="js/utils/toast.js"></script>
  <script src="js/main.js"></script>
  <script>
    App.init(false);
    App.initDefaultData();

    const form = document.getElementById('registerForm');

    function showError(id, msg) {
      document.getElementById(id).textContent = msg;
      document.getElementById(id.replace('Error', '')).classList.add('error');
    }
    function clearError(id) {
      document.getElementById(id).textContent = '';
      document.getElementById(id.replace('Error', '')).classList.remove('error');
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      let valid = true;

      const username = document.getElementById('username').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      [ 'usernameError', 'phoneError', 'passwordError', 'confirmPasswordError' ].forEach(clearError);

      if (!/^[a-zA-Z0-9_]{4,16}$/.test(username)) {
        showError('usernameError', '用户名须为4-16位字母、数字或下划线');
        valid = false;
      }

      if (!/^1[3-9]\d{9}$/.test(phone)) {
        showError('phoneError', '请输入有效的手机号码');
        valid = false;
      }

      if (password.length < 6) {
        showError('passwordError', '密码长度不能少于6位');
        valid = false;
      }

      if (password !== confirmPassword) {
        showError('confirmPasswordError', '两次密码输入不一致');
        valid = false;
      }

      if (!valid) return;

      const users = Storage.get('users', []);
      if (users.find(u => u.username === username)) {
        showError('usernameError', '该用户名已被注册');
        return;
      }

      const newUser = {
        id: Date.now(),
        username,
        password,
        phone,
        createdAt: new Date().toISOString()
      };
      users.push(newUser);
      Storage.set('users', users);

      Toast.success('注册成功，请登录');
      setTimeout(() => { window.location.href = 'login.html'; }, 800);
    });
  </script>
</body>
</html>
